services:
  # ============================================
  # BACKEND SERVICE (FastAPI + Python 3.11)
  # ============================================
  backend:
    build:
      context: "./Dubverse Backend"
      dockerfile: Dockerfile
    container_name: dubverse-backend
    ports:
      - "8000:8000"
    # GPU: uncomment below for NVIDIA GPU hosts (Azure VM, RunPod, etc.)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    volumes:
      # Mount source code for hot reload
      - "./Dubverse Backend/app:/app/app:ro"
      # Mount data directories (read-write)
      - "./Dubverse Backend/data:/app/data"
      - "./Dubverse Backend/uploads:/app/uploads"
      - "./Dubverse Backend/outputs:/app/outputs"
      # Persist HuggingFace/torch model cache across recreates
      - hf-cache:/root/.cache
    env_file:
      - Dubverse Backend/.env
    environment:
      # Only set vars NOT in .env here. All API keys and app settings
      # come from .env via env_file above. Do NOT duplicate them here
      # with ${VAR} syntax — that pulls from the host system env and
      # silently overrides the .env values.
      - PYTHONUNBUFFERED=1
      - PROCESSING_MODE=gpu
      - RUNPOD_SUBMIT_TIMEOUT_SEC=120
      - RUNPOD_STATUS_TIMEOUT_SEC=30
      - RUNPOD_POLL_TIMEOUT_SEC=7200
      - RUNPOD_QUEUE_TIMEOUT_SEC=7200
      - RUNPOD_HTTP_MAX_RETRIES=3
      - RUNPOD_HTTP_RETRY_BACKOFF_SEC=2
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 60s
      timeout: 30s
      retries: 10
      start_period: 60s
    networks:
      - dubverse-network

  # ============================================
  # FRONTEND SERVICE (Next.js)
  # ============================================
  frontend:
    build:
      context: "./Dubverse Frontend"
      dockerfile: Dockerfile
      target: development
      args:
        - NODE_ENV=development
    container_name: dubverse-frontend
    ports:
      - "3001:3001"
    volumes:
      # Mount source code for hot reload (no :ro — Turbopack needs write access for cache)
      - "./Dubverse Frontend/components:/app/components"
      - "./Dubverse Frontend/app:/app/app"
      - "./Dubverse Frontend/hooks:/app/hooks"
      - "./Dubverse Frontend/lib:/app/lib"
      - "./Dubverse Frontend/styles:/app/styles"
      - "./Dubverse Frontend/public:/app/public"
      - "./Dubverse Frontend/messages:/app/messages"
      - "./Dubverse Frontend/postcss.config.mjs:/app/postcss.config.mjs"
      - "./Dubverse Frontend/next.config.mjs:/app/next.config.mjs:ro"
      - "./Dubverse Frontend/.env.local:/app/.env.local:ro"
      - "./Dubverse Frontend/middleware.ts:/app/middleware.ts"
      - "./Dubverse Frontend/i18n.ts:/app/i18n.ts"
      # Exclude node_modules from mount
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - WATCHPACK_POLLING=true
    depends_on:
      backend:
        condition: service_healthy
    dns:
      - 8.8.8.8
      - 8.8.4.4
    restart: unless-stopped
    networks:
      - dubverse-network

  # ============================================
  # MONITORING SERVICE (Optional but Recommended)
  # ============================================
  # Uncomment to add Prometheus + Grafana monitoring
  # prometheus:
  #   image: prom/prometheus:latest
  #   container_name: dubverse-prometheus
  #   ports:
  #     - "9090:9090"
  #   volumes:
  #     - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
  #     - prometheus-data:/prometheus
  #   networks:
  #     - dubverse-network

networks:
  dubverse-network:
    driver: bridge

# Optional: Persistent volumes for development
volumes:
  prometheus-data:
  hf-cache:
